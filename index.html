<body>

<div id="boot"><div class="boot-logo">Dayouth OS</div><div class="boot-bar"><i></i></div></div>

<div id="desktop" hidden>
  <div id="icons"></div>
  <div id="windows"></div>

  <div id="startmenu" hidden>
    <label class="sm-search">
      <span style="display:inline-flex;align-items:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input id="sm-query" type="search" placeholder="Search for apps, files and settings" autocomplete="off">
    </label>

    <div class="sm-section"><span>Pinned</span><button class="sm-link" id="sm-all">All apps <b>›</b></button></div>
    <div id="sm-apps" class="sm-grid"></div>

    <div class="sm-section" id="sm-rec-head"><span>Recommended</span></div>
    <div id="sm-recent" class="sm-recent"></div>

    <div class="sm-foot">
      <button class="sm-user" style="display:inline-flex;align-items:center;gap:6px">
        <span class="sm-avatar" style="display:inline-flex;align-items:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span> guest
      </button>
      <button class="sm-power" id="sm-power" title="Power" style="display:inline-flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      </button>
    </div>
  </div>

  <div id="taskbar">
    <button id="startbtn" style="display:inline-flex;align-items:center;gap:6px">
      <span class="glyph" style="display:inline-flex;align-items:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </span> Start
    </button>
    <div id="tasks"></div>
    <div id="tray">
      <button id="theme-btn" title="Toggle theme" style="display:inline-flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div id="clock">--:--</div>
    </div>
  </div>
