<!doctype html>
<meta charset="utf-8">
<title>blog probe</title>
<body>
<script>
const log = [];
const report = {};
window.onerror = (m) => log.push('TOP ' + m);

const f = document.createElement('iframe');
f.width = 1280; f.height = 880; f.src = 'http://localhost:8811/';
document.body.appendChild(f);

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const step = async (name, fn) => { try { report[name] = await fn(); } catch (e) { report[name] = 'THREW ' + e.message; } };

f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  w.onerror = (m, s, l) => log.push(`IFRAME ${m} @${(s || '').split('/').pop()}:${l}`);
  w.addEventListener('unhandledrejection', (e) => log.push('REJECT ' + e.reason));

  await wait(600);
  await step('launch', () => { w.eval("OS.launch('blog')"); return 'ok'; });
  await wait(2500);

  const root = () => d.querySelector('.bl');
  const all = (s) => d.querySelectorAll(s).length;
  const txt = (s) => d.querySelector(s)?.textContent.replace(/\s+/g, ' ').trim();

  await step('mounted', () => !!root());
  await step('rootHtmlLen', () => root()?.innerHTML.length);
  await step('brand', () => txt('.bl-brand-txt b'));
  await step('heroMeta', () => txt('.bl-hero-meta'));
  await step('cards', () => all('.bl-post'));
  await step('kickers', () => all('.bl-kicker'));
  await step('cardFoot', () => txt('.bl-post-foot'));
  await step('railMinis', () => all('.bl-mini'));
  await step('rank', () => all('.bl-rank li'));
  await step('footer', () => txt('.bl-foot-bar'));
  await step('homeOverflow', () => (root().scrollWidth > root().clientWidth + 2 ? 'H-OVERFLOW' : 'ok'));

  await step('openPost', () => { d.querySelector('.bl-post').click(); return 'ok'; });
  await wait(1600);

  await step('crumbs', () => txt('.bl-crumbs'));
  await step('heroCat', () => txt('.bl-hero-cat'));
  await step('byline', () => txt('.bl-byline-txt small'));
  await step('tocItems', () => all('.bl-toc button'));
  await step('figures', () => all('.bl-fig'));
  await step('captions', () => all('.bl-fig figcaption'));
  await step('imgsLoaded', () => [...d.querySelectorAll('.bl-body img')].map((i) => i.naturalWidth).join(','));
  await step('dropCap', () => w.getComputedStyle(d.querySelector('.bl-body p'), '::first-letter').fontSize);
  await step('tags', () => all('.bl-tagline .bl-tag'));
  await step('authorbox', () => !!d.querySelector('.bl-authorbox'));
  await step('pager', () => [...d.querySelectorAll('.bl-pager-a')].map((b) => b.querySelector('small').textContent.trim()).join(' | '));
  await step('related', () => all('.bl-rel'));
  await step('postOverflow', () => (root().scrollWidth > root().clientWidth + 2 ? 'H-OVERFLOW' : 'ok'));

  await step('comment', () => {
    d.querySelector('[data-c=name]').value = 'قارئ';
    d.querySelector('[data-c=text]').value = 'تعليق تجريبي';
    d.querySelector('.bl-cform').dispatchEvent(new w.Event('submit', { cancelable: true }));
    return 'sent';
  });
  await wait(1400);
  await step('threadCount', () => all('.bl-thread li'));
  await step('badge', () => txt('.bl-badge'));
  await step('commentText', () => txt('.bl-thread li p'));

  await step('lightbox', async () => {
    d.querySelector('.bl-body img[data-zoom]').click();
    await wait(300);
    const lb = d.querySelector('.bl-lightbox');
    const win = d.querySelector('.win').getBoundingClientRect();
    const r = lb.getBoundingClientRect();
    const inside = r.height <= win.height + 2 && r.top >= win.top - 2;
    lb.click();
    await wait(200);
    return `open=${!lb.classList.contains('on') ? 'closedAfterClick' : 'STUCK'} inside=${inside}`;
  });

  await step('tocJump', async () => {
    const before = root().scrollTop;
    d.querySelector('.bl-toc button:last-child').click();
    await wait(700);
    return root().scrollTop > before ? 'scrolled' : `no-move (${before}->${root().scrollTop})`;
  });

  document.body.insertAdjacentHTML('beforeend',
    `<pre id="out">@@${JSON.stringify(report, null, 1)}\nLOG:\n${log.join('\n') || '(clean)'}@@</pre>`);
  document.title = 'DONE';
};
</script>
